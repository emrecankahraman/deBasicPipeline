name: review-pipeline

services:
  spark:
    image: apache/spark:3.5.1-python3
    container_name: review-spark
    working_dir: /app
    volumes:
      - ./:/app
    tty: true
    stdin_open: true

  qdrant:
    image: qdrant/qdrant:latest
    container_name: review-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT_API_KEY: "test-key"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage: